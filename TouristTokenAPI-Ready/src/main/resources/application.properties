spring.application.name=TouristTokenAPI

# Embedded H2 database: no MySQL installation or password required
spring.datasource.url=jdbc:h2:mem:touristdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8081

# Sample lab token. Change this to the valid token provided for your lab.
app.security.valid-token=ABC123
